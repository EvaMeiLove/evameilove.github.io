name: Publish site
on:
  workflow_dispatch:
    inputs:
      rebuild_history:
        description: 'Пересоздать историю main одним коммитом от владельца'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: github-pages
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: python3 scripts/check-static.py
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  history:
    if: inputs.rebuild_history && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set commit author
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: '272368635'
        run: |
          set -euo pipefail
          git config user.name "$OWNER"
          git config user.email "$OWNER_ID+$OWNER@users.noreply.github.com"
          tree=$(git rev-parse HEAD^{tree})
          root=$(git commit-tree "$tree" -m 'Initial site')
          git push origin "$root:refs/heads/main" "--force-with-lease=refs/heads/main:$GITHUB_SHA"
  deploy:
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      (needs.history.result == 'success' || needs.history.result == 'skipped')
    needs: [build, history]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
